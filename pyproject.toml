[project]
name = "rag-starter"
version = "0.1.0"
description = "Self-hosted RAG starter: hybrid search (pgvector + PostgreSQL full-text + reranker) and cited answers from a local LLM."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
